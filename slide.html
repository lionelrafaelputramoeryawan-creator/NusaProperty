<body>
    <!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        height: 100%;
      }

      body {
        background: white;
        font-family:
          Helvetica Neue,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 14px;
        color: #fff;
        margin: 0;
        padding: 0;
      }

      .swiper {
        width: 80%;
        height: 100%;
      }

      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 50%;
        height: 50%;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .swiper {
        margin-left: auto;
        margin-right: auto;
      }

      h1
        {
          text-align: center;
          color: #444;
          /* margin-bottom: 50px; */
          margin-top: 50px;
    
        }
       
        .swiper-pagination{
           margin-bottom: 400px;
        }
        

    </style>
  </head>

  <body>
    <h1>Swiper Demo</h1>
    <!-- Swiper -->
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="asset/feature-house.jpg" alt="Image 1"></div>
        <div class="swiper-slide"><img src="asset/hero-villa.jpg" alt="Image 2"></div>
        <div class="swiper-slide"><img src="asset/property-1.jpg" alt="Image 3"></div>
        <div class="swiper-slide"><img src="asset/property-3.jpg" alt="Image 4"></div>
        <div class="swiper-slide"><img src="asset/property-5.jpg" alt="Image 5"></div>
        <div class="swiper-slide"><img src="asset/property-4.jpg" alt="Image 6"></div>
        <div class="swiper-slide"><img src="asset/property-9.jpg" alt="Image 7"></div>
        <div class="swiper-slide"><img src="asset/property-6.jpg" alt="Image 8"></div>
        <div class="swiper-slide"><img src="asset/property-7.jpg" alt="Image 9"></div>
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper('.mySwiper', {
        slidesPerView: 3,
        spaceBetween: 30,
        loop: true,
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
        navigation: {
        //   nextEl: '.swiper-button-next',
        //   prevEl: '.swiper-button-prev',
        },
      });
    </script>
  </body>
</html>
</body>
</html>
